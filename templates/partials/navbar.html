{% if user.is_authenticated %}
    <a class="nav-link text-white" href="{% url 'dashboard' %}">Dashboard</a>
    {% if user.role == "client" %}
        <a class="nav-link text-white" href="#">Meus Jobs</a>
        <a class="nav-link text-white" href="#">Novo Job</a>
    {% elif user.role == "freelancer" %}
        <a class="nav-link text-white" href="#">Buscar Jobs</a>
        <a class="nav-link text-white" href="#">Minhas Propostas</a>
    {% endif %}
    <span class="text-white-50">Olá, {{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}" class="d-inline">
        {% csrf_token %}
        <button class="btn btn-sm btn-outline-light" type="submit">Sair</button>
    </form>
{% else %}
    <a class="nav-link text-white" href="{% url 'login' %}">Login</a>
    <a class="btn btn-sm btn-primary" href="{% url 'signup' %}">Cadastrar</a>
{% endif %}
